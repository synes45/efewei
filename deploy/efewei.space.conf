server {
    listen 80;
    listen [::]:80;
    server_name efewei.space www.efewei.space;

    root /var/www/efewei;
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        return 301 https://efewei.space$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name efewei.space www.efewei.space;

    ssl_certificate /etc/letsencrypt/live/efewei.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/efewei.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:efeweiSSL:1m;
    ssl_session_timeout 1d;

    root /var/www/efewei;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
